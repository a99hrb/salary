<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الراتب والمباشرة</title>
    
    <!-- استدعاء Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- استدعاء مكتبات React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- استدعاء Babel لترجمة كود JSX في المتصفح -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- خطوط عربية للحصول على مظهر أفضل (اختياري) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body>
    <!-- الحاوية التي سيتم عرض تطبيق React بداخلها -->
    <div id="root"></div>

    <!-- كود React -->
    <script type="text/babel">
        const { useState } = React;

        const App = () => {
          // تم تغيير القيمة الافتراضية هنا إلى 1
          const [baseSalary, setBaseSalary] = useState(5500);
          const [days, setDays] = useState(1); 
          const [selectedMonth, setSelectedMonth] = useState("أبريل");

          const months = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", 
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
          ];

          // الثوابت والنسب المتفق عليها
          const housingRatio = 0.25;  // بدل السكن 25%
          const transportRatio = 0.10; // بدل النقل 10%
          const gosiRatio = 0.09;      // خصم التأمينات 9%

          // --- حسابات الشهر الكامل ---
          const housing = baseSalary * housingRatio;
          const transport = baseSalary * transportRatio;
          const totalGross = baseSalary + housing + transport;
          
          // خصم التأمينات (من الأساسي + السكن فقط)
          const gosiBase = baseSalary + housing;
          const monthlyGosi = gosiBase * gosiRatio;
          const monthlyNet = totalGross - monthlyGosi;

          // --- حسابات أيام المباشرة (الشهر الماضي) ---
          const dailyNet = monthlyNet / 30;
          const totalDaysNet = dailyNet * days;
          const totalDaysGosi = (monthlyGosi / 30) * days;

          // --- حساب فترة المباشرة ---
          const startDay = 30 - days + 1;
          const periodText = days > 0 
            ? `من ${startDay} ${selectedMonth} إلى 30 ${selectedMonth}`
            : "لم يتم تحديد أيام";

          return (
            <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans" dir="rtl">
              <div className="max-w-3xl mx-auto space-y-6">
                
                {/* بطاقة المدخلات */}
                <div className="bg-white rounded-3xl shadow-sm p-6 md:p-8 border border-slate-200">
                  <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <span className="bg-blue-600 w-1.5 h-6 rounded-full"></span>
                    بيانات الراتب والمباشرة
                  </h2>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    {/* إدخال الراتب الأساسي */}
                    <div className="space-y-3">
                      <label className="text-sm font-bold text-slate-500">الراتب الأساسي في العقد:</label>
                      <div className="relative">
                        <input 
                          type="number" 
                          value={baseSalary} 
                          onChange={(e) => setBaseSalary(Number(e.target.value))}
                          className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 focus:bg-white transition-all outline-none text-2xl font-black text-blue-700"
                        />
                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">ريال</span>
                      </div>
                    </div>

                    {/* عداد الأيام واختيار الشهر */}
                    <div className="space-y-3">
                      <label className="text-sm font-bold text-slate-500">أيام المباشرة والشهر:</label>
                      <div className="flex gap-2">
                        <select 
                          value={selectedMonth}
                          onChange={(e) => setSelectedMonth(e.target.value)}
                          className="p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none font-bold text-slate-700 cursor-pointer"
                        >
                          {months.map(m => <option key={m} value={m}>{m}</option>)}
                        </select>
                        
                        <div className="flex-1 flex items-center bg-slate-50 border-2 border-slate-100 rounded-2xl overflow-hidden">
                          <button 
                            onClick={() => setDays(Math.max(0, days - 1))} 
                            className="px-4 py-2 hover:bg-slate-200 text-xl font-bold transition-colors"
                          >-</button>
                          <input 
                            type="number" 
                            value={days} 
                            onChange={(e) => setDays(Math.max(0, Math.min(30, Number(e.target.value))))}
                            className="w-full text-center bg-transparent font-black text-xl outline-none"
                          />
                          <button 
                            onClick={() => setDays(Math.min(30, days + 1))} 
                            className="px-4 py-2 hover:bg-slate-200 text-xl font-bold transition-colors"
                          >+</button>
                        </div>
                      </div>
                      
                      {/* عرض فترة المباشرة */}
                      <div className="mt-2 flex items-center gap-2 bg-indigo-50 text-indigo-700 p-3 rounded-xl border border-indigo-100">
                        <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span className="font-bold text-sm">الفترة: <span className="underline decoration-2 underline-offset-4">{periodText}</span></span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* ملخص الحسابات */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {/* الراتب الشهري المعتاد */}
                  <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                    <h3 className="text-slate-500 font-bold text-xs mb-4 uppercase tracking-wider">الراتب الشهري الصافي (المعتاد)</h3>
                    <div className="space-y-2">
                      <div className="flex justify-between text-sm"><span>إجمالي البدلات:</span> <span>{(housing + transport).toFixed(2)}</span></div>
                      <div className="flex justify-between text-sm text-red-500 font-medium"><span>حسم التأمينات:</span> <span>-{monthlyGosi.toFixed(2)}</span></div>
                      <div className="text-2xl font-black text-slate-800 pt-2 border-t mt-2">
                        {monthlyNet.toLocaleString(undefined, {minimumFractionDigits: 2})} <small className="text-xs font-normal">ريال</small>
                      </div>
                    </div>
                  </div>

                  {/* مستحقات المباشرة */}
                  <div className="bg-blue-600 p-6 rounded-3xl shadow-sm text-white">
                    <h3 className="text-blue-100 font-bold text-xs mb-4 uppercase tracking-wider">مستحقات المباشرة ({days} أيام)</h3>
                    <div className="space-y-2">
                      <div className="flex justify-between text-sm text-blue-100"><span>صافي اليوم الواحد:</span> <span>{dailyNet.toFixed(2)}</span></div>
                      <div className="flex justify-between text-sm text-blue-200"><span>حسم مدة مضافه بأثر رجعي:</span> <span>-{totalDaysGosi.toFixed(2)}</span></div>
                      <div className="text-2xl font-black pt-2 border-t border-blue-500 mt-2">
                        {totalDaysNet.toLocaleString(undefined, {minimumFractionDigits: 2})} <small className="text-xs font-normal text-blue-100">ريال</small>
                      </div>
                    </div>
                  </div>
                </div>

                {/* المجموع الكلي */}
                <div className="bg-slate-900 rounded-3xl p-8 text-center text-white shadow-xl">
                  <p className="text-slate-400 font-bold mb-2 text-xs tracking-widest uppercase">إجمالي المبلغ المتوقع إيداعه</p>
                  <h1 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">
                    {(monthlyNet + totalDaysNet).toLocaleString(undefined, {minimumFractionDigits: 2})}
                    <span className="text-xl mr-3 text-slate-400 font-bold">ريال</span>
                  </h1>
                  <div className="mt-4 flex flex-wrap justify-center gap-3">
                     <span className="bg-slate-800 text-slate-300 px-4 py-1.5 rounded-full text-xs border border-slate-700">راتب شهر كامل</span>
                     <span className="bg-slate-800 text-slate-300 px-4 py-1.5 rounded-full text-xs border border-slate-700">{days} أيام مباشرة</span>
                  </div>
                </div>

                {/* تذييل الصفحة */}
                <div className="text-center text-slate-400 text-[10px] font-medium pb-8 uppercase tracking-widest" dir="ltr">
                   Logic: (Basic + 25% Housing + 10% Transport) - 9% GOSI (Basic+Housing) | Dev by Abdullah Alharbi
                </div>

              </div>
            </div>
          );
        };

        // تهيئة وتشغيل تطبيق React في العنصر المحدد
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
